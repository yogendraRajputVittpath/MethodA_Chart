spring.application.name=CandleDataChart

# ===============================
# Server Config
# ===============================
server.port=9091

# ===============================
# MySQL Database Config
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/candledatachart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=xJtEVeiUl/Um2WLj8xvgvQ==
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ===============================
# JPA / Hibernate Config
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# IMPORTANT: Reserved Keywords (interval) ko handle karne ke liye
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Performance Tuning for Large Batches (19k+ stocks)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


# Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

logging.level.com.CandleData=DEBUG

# Transaction & Memory Management
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.connection.release_mode=after_transaction

