modulelist=com.p6spy.engine.logging.P6LogFactory

appender=com.p6spy.engine.spy.appender.Slf4JLogger

logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat

customLogMessageFormat=Execution Time: %(executionTime) ms | Connection:%(connectionId) | %(sqlSingleLine)

executionThreshold=25

excludecategories=info,debug,result,resultset,commit,rollback,batch